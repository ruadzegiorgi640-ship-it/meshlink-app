<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1b2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MeshLink" />
    <meta name="description" content="MeshLink — Hybrid LoRa + Internet Messenger." />
    <meta property="og:title" content="MeshLink" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href__="./icon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href__="./icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href__="./icon-512.svg" />
    <link rel="manifest" href__="./manifest.json" />
    <title>MeshLink</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('[SW] Registered:', reg.scope))
            .catch(err => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
